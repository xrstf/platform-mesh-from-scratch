apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    core.platform-mesh.io/operator-created: "true"
  name: opentelemetry-operator
  namespace: platform-mesh-system
spec:
  chartRef:
    kind: OCIRepository
    name: opentelemetry-operator
    namespace: platform-mesh-system
  dependsOn:
    - name: cert-manager
  install:
    createNamespace: true
    remediation:
      retries: -1
  interval: 1m
  releaseName: opentelemetry-operator
  targetNamespace: observability
  timeout: 15m
  upgrade:
    remediation:
      retries: 3
  values:
    admissionWebhooks:
      autoGenerateCert:
        enabled: true
      certManager:
        enabled: false
    manager:
      featureGatesMap:
        operator.targetallocator.mtls: true
