apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    core.platform-mesh.io/operator-created: "true"
  name: kcp-operator
  namespace: platform-mesh-system
spec:
  chartRef:
    kind: OCIRepository
    name: kcp-operator
    namespace: platform-mesh-system
  install:
    remediation:
      retries: -1
  interval: 1m
  releaseName: kcp-operator
  targetNamespace: kcp-operator
  timeout: 15m
  upgrade:
    remediation:
      retries: 3
