apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    core.platform-mesh.io/operator-created: "true"
  name: observability
  namespace: platform-mesh-system
spec:
  chartRef:
    kind: OCIRepository
    name: observability
    namespace: platform-mesh-system
  dependsOn:
    - name: prometheus-operator-crds
      namespace: platform-mesh-system
    - name: opentelemetry-operator
      namespace: platform-mesh-system
  install:
    remediation:
      retries: -1
  interval: 1m
  releaseName: observability
  targetNamespace: observability
  timeout: 15m
  upgrade:
    remediation:
      retries: 3
  values:
    prometheus:
      # TODO: All of these are disabled by default because observability once
      # was only a POC. We should revisit that and maybe enable them by default?
      alertmanager:
        enabled: true
      server:
        persistentVolume:
          enabled: true
