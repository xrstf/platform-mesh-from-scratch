apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    core.platform-mesh.io/operator-created: "true"
  name: traefik
  namespace: platform-mesh-system
spec:
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: platform-mesh-system
  dependsOn:
    - name: traefik-crds
  install:
    remediation:
      retries: -1
  interval: 1m
  releaseName: traefik
  targetNamespace: default
  timeout: 15m
  upgrade:
    remediation:
      retries: 3
  values:
    experimental:
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
    ports:
      websecure:
        exposedPort: 8443
        nodePort: 31000
    providers:
      kubernetesGateway:
        enabled: true
        experimentalChannel: true
    service:
      annotations:
        dns.gardener.cloud/class: garden
        dns.gardener.cloud/dnsnames: >-
          PM_BASE_DOMAIN,
          *.PM_BASE_DOMAIN,
          *.services.PM_BASE_DOMAIN,
          kcp.api.PM_BASE_DOMAIN,
          root.kcp.PM_BASE_DOMAIN,
          triton.kcp.PM_BASE_DOMAIN
      spec:
        clusterIP: TRAEFIK_SERVICE_IP
