apiVersion: v1
kind: Secret
metadata:
  name: kcp-webhook-secret
  namespace: platform-mesh-system
type: Opaque
# TODO: Instead of assembling the kubeconfig like this, use paths to an external
# CA file and mount the kubeconfig PLUS the rebac-webhook-cert into whereever they
# are needed. Like kcp does in most places.
# Saves us from having to "manually" create this and to manually rotate, since the
# kcp-operator already would handle it for us.
stringData:
  kubeconfig: |
    apiVersion: v1
    clusters:
    - cluster:
        # insert CA from the rebac-webhook-cert here
        certificate-authority-data: 
        server: https://rebac-authz-webhook.platform-mesh-system.svc.cluster.local:9443/authz
      name: webhook
    contexts:
    - context:
        cluster: webhook
      name: webhook
    current-context: webhook
    kind: Config
